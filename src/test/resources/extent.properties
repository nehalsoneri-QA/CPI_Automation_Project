# Extent Reports Configuration

# Report path
extent.reporter.spark.start=true
extent.reporter.spark.out=target/reports/SparkReport.html

# Screenshot configuration
screenshot.dir=target/screenshots/
screenshot.rel.path=../screenshots/

# System Info
systeminfo.Application=AI Automation Framework
systeminfo.Environment=QA
systeminfo.Browser=Chrome
systeminfo.OS=Windows

# Report theme (standard, dark)
extent.reporter.spark.config=src/test/resources/extent-config.xml

# Base folder for reports
basefolder.name=target/reports
basefolder.datetimepattern=yyyy-MM-dd_HH-mm-ss
