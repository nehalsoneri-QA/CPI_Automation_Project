# ================================
# Automation Framework Configuration
# ================================

# Application Settings
base.url=https://cpiai-dev.attri.ai/
application.name=CPI AI Automation Framework

# Browser Configuration
browser=chrome
headless=false

# Timeout Settings (in seconds)
implicit.wait=10
explicit.wait=20
page.load.timeout=30
script.timeout=30

# Screenshot Settings
screenshot.on.pass=true
screenshot.on.fail=true
screenshot.path=target/screenshots

# Test Data
test.data.path=src/test/resources/testdata/TestData.xlsx

# Reporting
reports.path=target/reports
extent.report.path=target/reports/ExtentReport.html

# Environment
environment=qa

# User Credentials (for testing - use environment variables in production)
valid.username=abhishek.byahut@attri.ai
valid.password=Attri@123
admin.username=abhishek.byahut@attri.ai
admin.password=Attri@123

# ================================
# AI/Self-Healing Configuration
# ================================

# Enable/Disable AI Self-Healing
healenium.enabled=false

# AI Provider (openai, anthropic, local)
ai.provider=openai
ai.api.key=
ai.api.endpoint=https://api.openai.com/v1/chat/completions
ai.model=gpt-4

# Self-Healing Settings
healing.enabled=true
healing.report.path=target/healing-report.json
healing.max.attempts=3
healing.confidence.threshold=70

# ================================
# Parallel Execution
# ================================
parallel.execution=false
thread.count=3

# ================================
# Retry Configuration
# ================================
retry.count=0
retry.enabled=false

# ================================
# Grid Configuration (for remote execution)
# ================================
grid.enabled=false
grid.url=http://localhost:4444/wd/hub

# ================================
# Logging
# ================================
log.level=INFO
log.path=target/logs
