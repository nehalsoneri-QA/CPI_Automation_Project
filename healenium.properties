# Healenium Self-Healing Configuration
# https://github.com/healenium/healenium-web

# Enable/disable healing
recovery-tries=3

# Score threshold for element healing (0-1)
score-cap=0.5

# Healing report settings
heal-enabled=true

# Backend connection (if using Healenium backend)
serverHost=localhost
serverPort=7878

# Selector parameters
findElementsAutoHealing=true
